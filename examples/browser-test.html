<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>neurai-sign-esp32 browser smoke test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f4f1e8;
        color: #1d1b19;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }

      .panel {
        background: #fffdf8;
        border: 1px solid #d7cfbf;
        border-radius: 12px;
        padding: 16px;
      }

      button {
        font: inherit;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #1d1b19;
        background: #1d1b19;
        color: #fffdf8;
        cursor: pointer;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      code {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Browser Smoke Test</h1>
        <p>
          This page imports <code>../dist/browser.js</code> directly and checks that the
          browser-facing API loads, pure helpers behave as expected, and Web Serial can be
          invoked from a user gesture.
        </p>
      </section>

      <section class="panel">
        <button id="connect-button" type="button">Request Serial Port</button>
      </section>

      <section class="panel">
        <pre id="log"></pre>
      </section>
    </main>

    <script type="module" src="./browser-smoke.js"></script>
  </body>
  </html>
